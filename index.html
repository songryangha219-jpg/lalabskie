<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lalab</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <header>

        <div class="icon-cont">
            <img class="icon-pic" src="wired-lineal-1153-horse.svg" alt="">
            <p class="title">Anniversary Quiz</p>
        </div>

        <div class="memory-cont">
            <a class="memory-link" href="">Memory</a>
        </div>

    </header>

    <div id="statusbar" class="statusbar" data-label="" style="--width: 20">
            <!-- <p>Question 1 of 10</p> -->
    </div>

    <div id="quizCont" class="quiz-cont">

        <div class="quizIcon">

            <img src="/images/heart-regular-full.svg" alt="">

        </div>

        <div class="quiz-pic-cont">
            <img src="" alt="">
        </div>

        <div class="question-container">
            <p class="question">
                What is the capital city of the Philippines
            </p>
        </div>

        <div class="choices-cont">

            <div class="choicesCont">
                <input type="radio" name="choicesRad" id="choices">
                <label id="choicesLabel" for="choices">Cebu</label>
            </div>

            <div class="choicesCont">
                <input type="radio" name="choicesRad" id="choices">
                <label id="choicesLabel" for="choices">Davao</label>
            </div>

            <div class="choicesCont">
                <input type="radio" name="choicesRad" id="choices">
                <label id="choicesLabel" for="choices">Manila</label>
            </div>

            <div class="choicesCont">
                <input type="radio" name="choicesRad" id="choices">
                <label id="choicesLabel" for="choices">Quezon</label>
            </div>

       

        </div>

        <button id="nextBtn" class="nextBtn">
            Next
        </button>

    </div>

    <div class="quiz-indicator-cont">

        <div class="correct-symbol-cont">
            <img class="indication-symbol" src="" alt="">
        </div>

        <div class="ind-text-cont">
            <p class="big-ind"></p>
            <p class="small-ind"></p>
        </div>

    </div>
    
</body>
<script src="main.js"></script>
</html>
